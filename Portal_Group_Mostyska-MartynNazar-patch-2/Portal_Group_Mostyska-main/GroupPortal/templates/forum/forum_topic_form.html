<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    {% load static %}
    <link rel="stylesheet" href="{% static 'forum/style.css' %}">
</head>
<body>
    <main class="forum-shell">
        <div class="form-panel">
        <span class="eyebrow">СПІЛЬНОТА</span>
        <h2>Створення нової теми</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <a href="{% url 'forum_list' %}" class="back-btn">Скасувати</a>
                <button type="submit" class="send-btn">Зберегти тему</button>
            </div>
        </form>
        </div>
    </main>
</body>
</html>
