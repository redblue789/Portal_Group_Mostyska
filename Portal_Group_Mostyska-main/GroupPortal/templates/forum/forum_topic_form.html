<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Нова тема</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%); min-height: 100vh; }
        input[type="text"], textarea {
            display: block; width: 100%; padding: 0.8rem 1rem;
            font-size: 1.2rem; border-radius: 0.5rem; border: 2px solid #cbd5e1;
            margin-bottom: 1.2rem; background-color: #f8fafc;
        }
        input[type="text"]:focus, textarea:focus {
            border-color: #4f46e5; outline: 0; background-color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.2);
        }
        label { font-size: 1.2rem; font-weight: 600; color: #1e293b; margin-bottom: 0.4rem; }
        .btn-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; border: none; }
    </style>
</head>
<body class="py-5">
    <div class="container bg-white p-4 p-md-5 rounded-4 shadow-lg" style="max-width: 650px;">
        <h2 class="fw-bold mb-4 fs-2 border-bottom pb-3" style="color: #312e81;">Створення нової теми</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex justify-content-between align-items-center mt-4 pt-2">
                <a href="{% url 'forum_list' %}" class="btn btn-outline-secondary btn-lg rounded-pill px-4 fw-semibold">Скасувати</a>
                <button type="submit" class="btn btn-gradient btn-lg rounded-pill px-5 fw-semibold shadow-sm">Зберегти тему</button>
            </div>
        </form>
    </div>
</body>
</html>
