<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Group Portal{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            color: #1f2937;
        }
        .container {
            max-width: 960px;
            margin: 40px auto;
            padding: 24px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: #111827;
            color: white;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 12px;
        }
        .auth-box {
            max-width: 420px;
            margin: 30px auto;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input, button {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 16px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        .errorlist {
            color: #dc2626;
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .card {
            padding: 18px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #f9fafb;
        }
    </style>
</head>
<body>
    <nav>
        <strong>Group Portal</strong>
        <div>
            <a href="{% url 'home' %}">Головна</a>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">Панель</a>
                <a href="{% url 'logout' %}">Вийти</a>
            {% else %}
                <a href="{% url 'login' %}">Увійти</a>
                <a href="{% url 'register' %}">Реєстрація</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
