{% extends 'GroupPortal/base.html' %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
    <div class="auth-box">
        <h2>Реєстрація</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Створити акаунт</button>
        </form>
        <p>Вже маєте акаунт? <a href="{% url 'login' %}">Увійти</a></p>
    </div>
{% endblock %}
